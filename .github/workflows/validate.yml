name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pytest==9.1.1
      - name: Unit tests
        run: python -m pytest -q
      - name: Python syntax
        run: python -m compileall -q sonos_service.py omasonos_backend scripts/smoke-backend.py
      - name: Shell syntax
        run: bash -n sonos-backend scripts/install-local.sh scripts/test-local.sh
      - name: Manifest contract
        run: python tests/validate_manifest.py
