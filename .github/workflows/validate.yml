name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Python syntax
        run: python -m compileall -q sonos_service.py omasonos_backend
      - name: Shell syntax
        run: bash -n sonos-backend
      - name: Manifest contract
        run: python tests/validate_manifest.py
